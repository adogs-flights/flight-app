# Cloudflare가 연결하는 공개 종단. 인증서는 발행된 시크릿 세대에서 읽는다.
server {
    listen 443 ssl;
    http2 on;
    server_name adogs-ticket.shop aws.adogs-ticket.shop;

    ssl_certificate     /run/secrets/flight/current/TLS_CERT;
    ssl_certificate_key /run/secrets/flight/current/TLS_KEY;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:5m;
    ssl_session_timeout 1h;

    client_max_body_size 50M;
    underscores_in_headers on;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/flight-locations.inc;
}

# 배포 스크립트와 컨테이너 헬스체크용 로컬 전용 종단.
# 호스트의 127.0.0.1:18091에만 묶여 있어 외부에서 닿지 않는다.
server {
    listen 8080;
    server_name _;

    client_max_body_size 50M;
    underscores_in_headers on;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/flight-locations.inc;
}
