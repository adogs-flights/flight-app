# 기존 도메인. 폐기하지 않고 새 도메인으로 영구 리다이렉트한다.
# 기존 링크·북마크·공유 카드·검색 결과가 끊기지 않게 하려는 것이다.
server {
    listen 443 ssl;
    http2 on;
    server_name adogs-ticket.shop www.adogs-ticket.shop;

    ssl_certificate     /run/secrets/flight/current/TLS_CERT;
    ssl_certificate_key /run/secrets/flight/current/TLS_KEY;

    include /etc/nginx/conf.d/flight-tls.inc;

    # 구글 드라이브 감시 채널이 아직 기존 주소를 가리키고 있다. 채널이 모두
    # 새 주소로 갱신될 때까지 이 경로만 리다이렉트하지 않고 그대로 처리한다.
    location = /api/gdrive/webhook {
        set $flight_backend http://flight-backend:8010;
        proxy_pass $flight_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        return 301 https://haebongticket.com$request_uri;
    }
}

# 새 도메인. 캐노니컬이다.
server {
    listen 443 ssl;
    http2 on;
    server_name haebongticket.com;

    ssl_certificate     /run/secrets/flight/current/TLS_CERT_NEW;
    ssl_certificate_key /run/secrets/flight/current/TLS_KEY_NEW;

    include /etc/nginx/conf.d/flight-tls.inc;
    include /etc/nginx/conf.d/flight-locations.inc;
}

# www는 캐노니컬 하나로 모은다. 같은 내용이 두 주소로 노출되지 않게 한다.
server {
    listen 443 ssl;
    http2 on;
    server_name www.haebongticket.com;

    ssl_certificate     /run/secrets/flight/current/TLS_CERT_NEW;
    ssl_certificate_key /run/secrets/flight/current/TLS_KEY_NEW;

    include /etc/nginx/conf.d/flight-tls.inc;

    location / {
        return 301 https://haebongticket.com$request_uri;
    }
}

# 배포 스크립트와 컨테이너 헬스체크용 로컬 전용 종단.
# 호스트의 127.0.0.1:18091에만 묶여 있어 외부에서 닿지 않는다.
server {
    listen 8080;
    server_name _;

    client_max_body_size 50M;
    underscores_in_headers on;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/conf.d/flight-locations.inc;
}
