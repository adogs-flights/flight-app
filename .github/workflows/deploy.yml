name: Deploy Flight App

on:
  push:
    branches: [ "main" ]
  # 이전 기간 동안 작업 브랜치에서 수동으로 실행해 ECR을 채우고 검증한다.
  workflow_dispatch:

permissions:
  contents: read
  # OIDC로 AWS 역할을 맡는다. 저장된 AWS 자격증명도 SSH 개인키도 없다.
  id-token: write

concurrency:
  group: flight-app-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE: arn:aws:iam::966203577238:role/haebong-github-deploy
  REGISTRY: 966203577238.dkr.ecr.ap-northeast-2.amazonaws.com
  INSTANCE_ID: i-037a39eaf90d1754a

jobs:
  # 변경 사항 감지 (Path-based filtering)
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            config:
              - 'docker-compose.yml'
              - 'nginx/**'
              - 'scripts/**'
              - '.github/workflows/deploy.yml'

  # 프론트엔드 빌드 (병렬 실행 & 캐싱 적용)
  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    # aarch64(arm64) 서버에 배포하므로 네이티브 ARM64 러너에서 빌드한다.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/flight-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 백엔드 빌드 (병렬 실행 & 캐싱 적용)
  build-backend:
    needs: changes
    if: |
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.frontend == 'true' ||
      needs.changes.outputs.config == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        # 백엔드는 불변 커밋 태그만 쓴다. 같은 태그를 덮어쓸 수 없다.
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/flight-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 통합 배포 (빌드 성공 또는 설정 변경 시 실행)
  deploy:
    needs: [changes, build-frontend, build-backend]
    if: |
      always() &&
      needs.build-backend.result == 'success' &&
      (needs.build-frontend.result == 'success' || needs.build-frontend.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test deployment failure boundaries
        run: node --test scripts/deploy-aws.test.mjs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      # 배포 파일을 S3로 올리고 인스턴스가 인스턴스 프로파일로 내려받는다.
      # SSH 포트를 열지 않고 개인키도 보관하지 않는다.
      - name: Stage deployment files
        run: |
          set -euo pipefail
          tar czf /tmp/deploy-files.tar.gz \
            docker-compose.yml \
            nginx/conf.d \
            scripts/db/init-roles.sh \
            scripts/deploy-aws.sh \
            frontend/public/privacy.html \
            frontend/public/terms.html
          aws s3 cp /tmp/deploy-files.tar.gz \
            s3://adogs-ticket-uploads/_deploy/${{ github.sha }}.tar.gz

      - name: Deploy via SSM
        run: |
          set -euo pipefail
          command_id=$(aws ssm send-command \
            --instance-ids "${{ env.INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --parameters "commands=[\"set -euo pipefail\",\"cd /home/ubuntu/flight-app\",\"aws s3 cp s3://adogs-ticket-uploads/_deploy/${{ github.sha }}.tar.gz /tmp/d.tar.gz --region ${{ env.AWS_REGION }} --quiet\",\"tar xzf /tmp/d.tar.gz -C /home/ubuntu/flight-app\",\"rm -f /tmp/d.tar.gz\",\"chown -R ubuntu:ubuntu /home/ubuntu/flight-app\",\"chmod +x scripts/deploy-aws.sh scripts/db/init-roles.sh\",\"bash scripts/deploy-aws.sh ${{ github.sha }}\"],executionTimeout=[900]" \
            --timeout-seconds 900 \
            --query 'Command.CommandId' --output text)
          echo "SSM 명령: $command_id"

          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" --instance-id "${{ env.INSTANCE_ID }}" \
              --query 'Status' --output text)
            case "$status" in
              Success)
                aws ssm get-command-invocation --command-id "$command_id" \
                  --instance-id "${{ env.INSTANCE_ID }}" \
                  --query 'StandardOutputContent' --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$command_id" \
                  --instance-id "${{ env.INSTANCE_ID }}" \
                  --query '{출력:StandardOutputContent,오류:StandardErrorContent}' --output json
                echo "배포 실패: $status" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo '배포 상태 확인이 시간 초과되었다' >&2
          exit 1

      - name: Verify public endpoint
        run: |
          curl --fail --silent --show-error --location --max-redirs 3 \
            --retry 10 --retry-delay 3 \
            https://adogs-ticket.shop/api/static/airlines >/dev/null
          echo '공개 종단 확인 완료'
