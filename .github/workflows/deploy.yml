name: Deploy Flight App

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  # 변경 사항 감지 (Path-based filtering)
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      config: ${{ steps.filter.outputs.config }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            config:
              - 'docker-compose.yml'
              - 'nginx/**'
              - '.github/workflows/deploy.yml'

  # 프론트엔드 빌드 (병렬 실행 & 캐싱 적용)
  build-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    # aarch64(arm64) 서버에 배포하므로 네이티브 ARM64 러너에서 빌드한다.
    # 예전엔 amd64 러너 + QEMU 에뮬레이션으로 arm64를 빌드해 느렸다.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/flight-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 백엔드 빌드 (병렬 실행 & 캐싱 적용)
  build-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # aarch64(arm64) 서버에 배포하므로 네이티브 ARM64 러너에서 빌드한다.
    # 예전엔 amd64 러너 + QEMU 에뮬레이션으로 arm64를 빌드해 느렸다.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/flight-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 통합 배포 (빌드 성공 또는 설정 변경 시 실행)
  deploy:
    needs: [changes, build-frontend, build-backend]
    if: |
      always() &&
      (needs.build-frontend.result == 'success' || needs.build-backend.result == 'success' || 
       (needs.changes.outputs.config == 'true' && needs.build-frontend.result != 'failure' && needs.build-backend.result != 'failure'))
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME_FRONTEND: ghcr.io/${{ github.repository_owner }}/flight-frontend
      IMAGE_NAME_BACKEND: ghcr.io/${{ github.repository_owner }}/flight-backend
    steps:
      - uses: actions/checkout@v4
      - name: Copy deployment files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_KEY }}
          port: ${{ secrets.ORACLE_PORT }}
          source: "docker-compose.yml,nginx,frontend/public/privacy.html,frontend/public/terms.html"
          target: "/home/ubuntu/flight-app"

      - name: Deploy via SSH (Robust)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_KEY }}
          port: ${{ secrets.ORACLE_PORT }}
          envs: IMAGE_NAME_FRONTEND, IMAGE_NAME_BACKEND
          script: |
            set -e  # 에러 발생 시 즉시 중단
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            cd /home/ubuntu/flight-app
            
            # .env 파일 생성
            cat << 'EOF' > .env
            ${{ secrets.ENV_FILE }}
            EOF
            
            # 환경 변수 명시적 전달 및 이미지 갱신
            export IMAGE_NAME_FRONTEND=$IMAGE_NAME_FRONTEND
            export IMAGE_NAME_BACKEND=$IMAGE_NAME_BACKEND

            docker network inspect shared-infra >/dev/null

            docker compose pull

            # shared-infra PostgreSQL이 healthy가 될 때까지 기다린 뒤 마이그레이션을 먼저 적용한다.
            # main.py도 기동 시 alembic upgrade를 돌리지만 그쪽은 예외를 삼켜서
            # 실패해도 앱이 그대로 뜬다. 여기서 돌려야 set -e로 배포가 멈춘다.
            for attempt in $(seq 1 30); do
              if docker exec postgresql sh -lc 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null 2>&1; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "shared-infra PostgreSQL did not become ready"
                exit 1
              fi
              sleep 2
            done

            docker compose run --rm flight-backend alembic upgrade head

            docker compose up -d --remove-orphans

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error -H 'Host: adogs-ticket.shop' http://127.0.0.1:18091/ >/dev/null; then
                exit 0
              fi
              if [ "$attempt" -eq 30 ]; then
                docker compose ps
                docker logs --tail 100 flight-nginx || true
                exit 1
              fi
              sleep 2
            done
